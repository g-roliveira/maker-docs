name: Docs

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mintlify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Mintlify CLI
        run: |
          npm install --global mint@4.2.1184
          mint --version

      - name: Run Markdown/MDX AST audit
        run: npm run docs:lint -- --report reports/markdown-ast-audit.json

      - name: Run validator regression tests
        run: npm run test:unit

      - name: Validate MDX, frontmatter and build
        run: mint validate

      - name: Check broken links
        run: mint broken-links

      - name: Check accessibility
        run: mint a11y

      - name: Reject internal links ending in .md
        run: npm run docs:guard

      - name: Check site config formatting
        run: npm run format:site

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Visual and rendering tests
        run: npm run test:visual

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: reports/playwright-report/
          if-no-files-found: ignore

      - name: Upload validation reports and failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-validation-reports
          path: |
            reports/
            test-results/
          if-no-files-found: ignore

  changed-files:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint changed Markdown
        run: npm run lint:changed -- "origin/${{ github.base_ref }}"

  audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Mintlify CLI
        run: |
          npm install --global mint@4.2.1184
          mint --version

      - name: Full Markdownlint audit
        run: |
          mkdir -p reports
          npx markdownlint-cli2 "**/*.{md,mdx}" > reports/markdownlint.txt 2>&1 || true
          tail -20 reports/markdownlint.txt

      - name: Full Prettier audit
        run: |
          mkdir -p reports
          npx prettier --check "**/*.{md,mdx,json,yml,yaml}" > reports/prettier.txt 2>&1 || true
          tail -20 reports/prettier.txt

      - name: Anchor and snippet audit
        run: |
          mkdir -p reports
          mint broken-links --check-anchors --check-snippets > reports/anchors.txt 2>&1 || true
          tail -20 reports/anchors.txt

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-audit
          path: reports/
          if-no-files-found: ignore
